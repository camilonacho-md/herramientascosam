<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parser de Exámenes de Laboratorio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f1f0ec;
    --border: #e0ddd7;
    --border2: #ccc9c2;
    --text: #1a1916;
    --text2: #6b6860;
    --text3: #9c9a95;
    --accent: #1a1916;
    --green-bg: #eaf3de;
    --green-text: #3b6d11;
    --red-bg: #fcebeb;
    --red-text: #a32d2d;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'Courier New', Courier, monospace;
    --sans: system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1916;
      --surface: #252420;
      --surface2: #2e2c28;
      --border: #3a3832;
      --border2: #4a4840;
      --text: #f0ede8;
      --text2: #9c9a95;
      --text3: #6b6860;
      --accent: #f0ede8;
      --green-bg: #173404;
      --green-text: #c0dd97;
      --red-bg: #501313;
      --red-text: #f09595;
      --amber-bg: #412402;
      --amber-text: #fac775;
    }
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo svg { width: 18px; height: 18px; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 24px;
  }

  .input-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 10px;
    display: block;
  }

  textarea {
    width: 100%;
    height: 160px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    padding: 12px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--border2); }
  textarea::placeholder { color: var(--text3); }

  .controls {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    transition: background 0.12s, opacity 0.12s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface2); }

  .btn.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .btn.primary:hover { opacity: 0.85; }

  .view-toggle {
    margin-left: auto;
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .view-toggle button {
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text2);
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }

  .view-toggle button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--border);
    border-radius: calc(var(--radius) - 2px);
  }

  .meta-bar {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .meta-bar strong { color: var(--text); font-weight: 600; }

  .section-block { margin-bottom: 20px; }

  .section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 0 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  /* TABLE VIEW */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .name-cell { font-size: 13px; color: var(--text); }

  .result-cell { font-weight: 600; white-space: nowrap; }
  .result-cell.high { color: var(--red-text); }
  .result-cell.low { color: var(--amber-text); }
  .result-cell.normal { color: var(--green-text); }

  .unit-tag { font-size: 11px; font-weight: 400; color: var(--text3); margin-left: 3px; }

  .ref-cell { font-size: 12px; color: var(--text3); }

  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge.high { background: var(--red-bg); color: var(--red-text); }
  .badge.low { background: var(--amber-bg); color: var(--amber-text); }
  .badge.normal { background: var(--green-bg); color: var(--green-text); }

  /* COMPACT VIEW */
  .compact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }

  .compact-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .compact-card.high { border-left: 3px solid var(--red-text); }
  .compact-card.low { border-left: 3px solid var(--amber-text); }
  .compact-card.normal { border-left: 3px solid var(--green-text); }

  .compact-name {
    font-size: 11px;
    color: var(--text2);
    line-height: 1.3;
  }

  .compact-value {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
  }

  .compact-value.high { color: var(--red-text); }
  .compact-value.low { color: var(--amber-text); }
  .compact-value.normal { color: var(--green-text); }

  .compact-unit {
    font-size: 10px;
    color: var(--text3);
    font-weight: 400;
  }

  /* COPY OUTPUT */
  .copy-area {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    margin-top: 16px;
  }

  .copy-btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .empty-msg {
    color: var(--text3);
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }

  .section-block + .section-block { margin-top: 4px; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .output-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text2);
  }

  .copy-feedback {
    font-size: 12px;
    color: var(--green-text);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .copy-feedback.show { opacity: 1; }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    main { padding: 20px 14px 40px; }
    .view-toggle { margin-left: 0; }
    .controls { gap: 7px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
      <line x1="5" y1="6" x2="13" y2="6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="5" y1="9" x2="13" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    Parser Laboratorio
  </div>
  <div class="header-actions">
    <span class="copy-feedback" id="globalFeedback">Copiado</span>
  </div>
</header>

<main>
  <div class="input-card">
    <span class="input-label">Texto del informe</span>
    <textarea id="input" placeholder="Pega aquí el texto completo copiado del PDF o sistema del laboratorio..."></textarea>
    <div class="controls">
      <button class="btn primary" onclick="parse()">Parsear resultados</button>
      <button class="btn" onclick="clearAll()">Limpiar</button>
      <div class="view-toggle" id="viewToggle" style="display:none">
        <button id="btnFull" class="active" onclick="setView('full')">Tabla completa</button>
        <button id="btnCompact" onclick="setView('compact')">Solo nombre y valor</button>
        <button id="btnCopy" onclick="setView('copy')">Texto para copiar</button>
      </div>
    </div>
  </div>

  <div id="output"></div>
</main>

<script>
let currentView = 'full';
let parsedData = null;

const SECTION_KEYWORDS = [
  'COAGULACIÓN','QUÍMICA SANGUÍNEA','HEMATOLOGÍA','INMUNOQUÍMICA',
  'HEMOGRAMA','PERFIL TIROIDEO','ORINA','LIPIDOGRAMA','MICROBIOLOGÍA',
  'SEROLOGÍA','ELECTROLITOS','GASES ARTERIALES','PROTEÍNAS'
];

const SKIP_PATTERNS = [
  /^N[oº°]\s*Petici/i, /^Paciente\s*:/i, /^RUT\s*:/i, /^Edad\s*:/i,
  /^Médico\s*:/i, /^Procedencia\s*:/i, /^Fecha\s*(Petici|Inform)/i,
  /^LABORATORIO/i, /^Validado por/i, /^DIRECTOR/i, /^T\.M\./i,
  /^Adscrito/i, /^Informe final/i, /^Nombre social/i, /^IDHIS/i,
  /^\d{2}\/\d{2}\/\d{4}/, /^\d+:\d+:\d+/, /^\d+ de \d+/,
  /^Muestra:/i, /^Nombre Prueba/i, /^Limitaciones/i, /^Nota \d:/i,
  /^Ref:/i, /^Puntaje/i, /^Repetir en/i, /^Considerar/i, /^Sugerencia/i,
  /^Riesgo de/i, /^<1\./, /^1\.30/, /^>2\./, /^Equipo:/i, /^Método:/i,
  /^Características al Frotis/i, /^Fórmula Diferencial/i,
  /^Estimación del/i, /^Vel\. de Filtr/i, /^Insuficiencia/i,
  /^\d{8}-\d/,
];

const UNIT_RE = /\b(mg\s*\/\s*dl|g\s*\/\s*dl|mEq\/L|μlU\s*\/\s*ml|ng\s*\/\s*dl|U\s*\/\s*l|x10\^[36]\/uL|x\s*10\^[36]\/uL|mm\/H|fl|pg|%|seg|μmol\/L|mmHg|ml\/min\/1\.73mt\^2)\b/i;
const REFRANGE_RE = /(\d[\d.,]*)\s*[-–]\s*(\d[\d.,]*)/;
const LESSTHAN_RE = /[<≤≥>]\s*(\d[\d.,]+)/;

function parseNum(s) {
  if (!s) return null;
  const n = parseFloat(s.replace(',', '.'));
  return isNaN(n) ? null : n;
}

function statusOf(val, ref) {
  if (!ref || val === null) return 'normal';
  const rr = REFRANGE_RE.exec(ref);
  if (rr) {
    const lo = parseNum(rr[1]), hi = parseNum(rr[2]);
    if (lo !== null && hi !== null) {
      if (val < lo) return 'low';
      if (val > hi) return 'high';
      return 'normal';
    }
  }
  const lt = LESSTHAN_RE.exec(ref);
  if (lt) {
    const lim = parseNum(lt[1]);
    const op = ref[0];
    if (lim !== null) {
      if ((op === '<' || op === '≤') && val > lim) return 'high';
      if ((op === '>' || op === '≥') && val < lim) return 'low';
    }
  }
  return 'normal';
}

function shouldSkip(line) {
  return SKIP_PATTERNS.some(p => p.test(line));
}

function detectSection(line) {
  for (const kw of SECTION_KEYWORDS) {
    if (line.toUpperCase().includes(kw)) return kw;
  }
  return null;
}

function extractMeta(lines) {
  let paciente = '', fecha = '', rut = '';
  for (const l of lines) {
    if (/Paciente\s*:/i.test(l) && !paciente) paciente = l.replace(/Paciente\s*:/i,'').trim();
    if (/RUT\s*:/i.test(l) && !rut) rut = l.replace(/RUT\s*:/i,'').trim();
    if (/Fecha Petici/i.test(l) && !fecha) {
      const m = l.match(/(\d{2}\/\d{2}\/\d{4})/);
      if (m) fecha = m[1];
    }
  }
  return { paciente, fecha, rut };
}

function tryParseRow(line) {
  const unitMatch = UNIT_RE.exec(line);
  if (!unitMatch) return null;
  const unitIdx = unitMatch.index;
  const unit = unitMatch[0].trim();
  const before = line.slice(0, unitIdx).trim();
  const after = line.slice(unitIdx + unitMatch[0].length).trim();
  const beforeParts = before.split(/\s{2,}|\t/);

  let name, valRaw;
  if (beforeParts.length < 2) {
    const bTokens = before.split(/\s+/);
    valRaw = bTokens[bTokens.length - 1].replace('*','');
    name = bTokens.slice(0, -1).join(' ').replace(/\*$/, '').trim();
  } else {
    valRaw = beforeParts[beforeParts.length - 1].replace('*','').trim();
    name = beforeParts.slice(0, -1).join(' ').replace(/\*$/, '').trim();
  }

  const val = parseNum(valRaw);
  const refParts = after.split(/\s{2,}|\t/);
  const ref = (refParts[0] || '').trim();
  if (!name || name.length < 3) return null;
  return { name, result: valRaw, unit, ref, val };
}

function tryParseRowNoUnit(line) {
  const parts = line.split(/\s{2,}|\t/);
  if (parts.length < 3) return null;
  let numIdx = -1;
  for (let i = 1; i < parts.length; i++) {
    if (/^\*?[\d.,><=]+$/.test(parts[i].trim())) { numIdx = i; break; }
  }
  if (numIdx < 1) return null;
  const name = parts.slice(0, numIdx).join(' ').replace(/\*$/, '').trim();
  const result = parts[numIdx].replace('*','').trim();
  const ref = parts.slice(numIdx + 1).join(' ').trim();
  if (!name || name.length < 3) return null;
  return { name, result, unit: '', ref, val: parseNum(result) };
}

function runParse(raw) {
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const meta = extractMeta(lines);
  const sections = {};
  const sectionOrder = [];
  let currentSection = 'General';

  for (const line of lines) {
    if (shouldSkip(line)) continue;
    const sec = detectSection(line);
    if (sec) {
      currentSection = sec;
      if (!sections[sec]) { sections[sec] = []; sectionOrder.push(sec); }
      continue;
    }
    const row = tryParseRow(line) || tryParseRowNoUnit(line);
    if (!row) continue;
    if (!sections[currentSection]) { sections[currentSection] = []; sectionOrder.push(currentSection); }
    sections[currentSection].push({ ...row, status: statusOf(row.val, row.ref) });
  }

  return { meta, sections, sectionOrder };
}

function setView(v) {
  currentView = v;
  document.getElementById('btnFull').classList.toggle('active', v === 'full');
  document.getElementById('btnCompact').classList.toggle('active', v === 'compact');
  document.getElementById('btnCopy').classList.toggle('active', v === 'copy');
  if (parsedData) renderOutput(parsedData);
}

function statusLabel(s) {
  return s === 'high' ? 'Alto' : s === 'low' ? 'Bajo' : 'Normal';
}

function renderOutput(data) {
  const { meta, sections, sectionOrder } = data;
  const out = document.getElementById('output');

  if (!sectionOrder.length) {
    out.innerHTML = '<p class="empty-msg">No se encontraron resultados reconocibles.<br>Asegúrate de pegar el texto completo del informe.</p>';
    return;
  }

  let html = '';

  // Meta bar
  if (meta.paciente || meta.fecha) {
    html += '<div class="meta-bar">';
    if (meta.paciente) html += `<span><strong>${meta.paciente}</strong></span>`;
    if (meta.rut) html += `<span>RUT: ${meta.rut}</span>`;
    if (meta.fecha) html += `<span>Fecha: ${meta.fecha}</span>`;
    html += '</div>';
  }

  if (currentView === 'full') {
    html += renderFull(sections, sectionOrder);
  } else if (currentView === 'compact') {
    html += renderCompact(sections, sectionOrder);
  } else {
    html += renderCopy(meta, sections, sectionOrder);
  }

  out.innerHTML = html;
}

function renderFull(sections, sectionOrder) {
  let html = '';
  for (const sec of sectionOrder) {
    const rows = sections[sec];
    if (!rows.length) continue;
    html += `<div class="section-block">
      <div class="section-title">${sec}</div>
      <table>
        <thead><tr>
          <th style="width:42%">Prueba</th>
          <th>Resultado</th>
          <th>Referencia</th>
          <th>Estado</th>
        </tr></thead><tbody>`;
    for (const r of rows) {
      const u = r.unit ? `<span class="unit-tag">${r.unit}</span>` : '';
      html += `<tr>
        <td class="name-cell">${r.name}</td>
        <td class="result-cell ${r.status}">${r.result}${u}</td>
        <td class="ref-cell">${r.ref || '—'}</td>
        <td><span class="badge ${r.status}">${statusLabel(r.status)}</span></td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }
  return html;
}

function renderCompact(sections, sectionOrder) {
  let html = '';
  for (const sec of sectionOrder) {
    const rows = sections[sec];
    if (!rows.length) continue;
    html += `<div class="section-block">
      <div class="section-title">${sec}</div>
      <div class="compact-grid">`;
    for (const r of rows) {
      const u = r.unit ? `<span class="compact-unit">${r.unit}</span>` : '';
      html += `<div class="compact-card ${r.status}">
        <div class="compact-name">${r.name}</div>
        <div class="compact-value ${r.status}">${r.result} ${u}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function renderCopy(meta, sections, sectionOrder) {
  const lines = [];
  if (meta.paciente) lines.push(`Paciente: ${meta.paciente}${meta.rut ? ' · RUT ' + meta.rut : ''}${meta.fecha ? ' · ' + meta.fecha : ''}`);

  for (const sec of sectionOrder) {
    const rows = sections[sec];
    if (!rows.length) continue;
    lines.push('');
    lines.push(`— ${sec} —`);
    for (const r of rows) {
      const u = r.unit ? ` ${r.unit}` : '';
      const flag = r.status === 'high' ? ' [ALTO]' : r.status === 'low' ? ' [BAJO]' : '';
      lines.push(`${r.name}: ${r.result}${u}${flag}`);
    }
  }

  const text = lines.join('\n');

  return `
    <div class="output-header">
      <span class="output-title">Texto listo para copiar</span>
      <button class="btn" onclick="copyText()">Copiar todo</button>
    </div>
    <pre class="copy-area" id="copyArea">${escapeHtml(text)}</pre>
    <textarea id="hiddenCopy" style="position:absolute;left:-9999px;top:0">${text}</textarea>
  `;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyText() {
  const t = document.getElementById('hiddenCopy');
  if (!t) return;
  t.select();
  document.execCommand('copy');
  const fb = document.getElementById('globalFeedback');
  fb.classList.add('show');
  setTimeout(() => fb.classList.remove('show'), 1800);
}

function parse() {
  const raw = document.getElementById('input').value;
  const out = document.getElementById('output');
  if (!raw.trim()) {
    out.innerHTML = '<p class="empty-msg">Pega el texto del informe antes de parsear.</p>';
    return;
  }
  parsedData = runParse(raw);
  document.getElementById('viewToggle').style.display = 'flex';
  renderOutput(parsedData);
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').innerHTML = '';
  document.getElementById('viewToggle').style.display = 'none';
  parsedData = null;
  currentView = 'full';
  document.getElementById('btnFull').classList.add('active');
  document.getElementById('btnCompact').classList.remove('active');
  document.getElementById('btnCopy').classList.remove('active');
}
</script>
</body>
</html>
